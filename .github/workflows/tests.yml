name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (flake8)
        run: flake8 shortcut_lens --max-line-length=100 --extend-ignore=E203,W503

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=shortcut_lens --cov-report=term-missing

      - name: Smoke-test full pipeline (--quick)
        run: python experiments/reproduce_all.py --quick --n-folds 3
